name: CI (deliberately broken)
on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [17, 21]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-versoin }}
          distribution: temurin
      - run: mvn --batch-mode --no-transfer-progres test
        working-directory: ./sample-app
