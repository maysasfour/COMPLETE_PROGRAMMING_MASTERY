worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # A real upstream pool: nginx load-balances across these three real
    # backend processes using its default round-robin algorithm. If one
    # becomes unreachable, nginx marks it as failed (after `max_fails`
    # attempts within `fail_timeout`) and stops routing to it until it
    # recovers -- a real, automatic failover, not a hypothetical one.
    upstream backend_pool {
        server 127.0.0.1:4001 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:4002 max_fails=1 fail_timeout=5s;
        server 127.0.0.1:4003 max_fails=1 fail_timeout=5s;
    }

    server {
        listen       8090;
        server_name  localhost;

        location / {
            proxy_pass http://backend_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # A failed connection attempt to one backend is retried against
            # the NEXT one in the pool automatically -- this is what makes
            # a single dead backend invisible to the client.
            proxy_next_upstream error timeout;
        }
    }
}
