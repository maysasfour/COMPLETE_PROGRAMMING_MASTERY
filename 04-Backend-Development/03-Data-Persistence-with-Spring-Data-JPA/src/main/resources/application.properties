server.port=8091

# H2: a pure-Java, EMBEDDED database -- no external database server/install needed at all.
spring.datasource.url=jdbc:h2:mem:taskdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update: Hibernate creates/updates the schema from the @Entity classes
# automatically -- convenient for this lesson; real production apps typically use
# a migration tool (Flyway/Liquibase) instead of relying on auto schema generation.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
