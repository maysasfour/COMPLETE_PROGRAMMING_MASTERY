<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pricing — CSS3 Exercise Solution</title>
  <link rel="stylesheet" href="solution-01.css">
</head>
<body>
  <main>
    <h1>Choose Your Plan</h1>
    <div class="pricing-grid">
      <article class="card">
        <h2>Basic</h2>
        <p class="price">$9<span>/mo</span></p>
        <ul>
          <li>1 project</li>
          <li>Community support</li>
          <li>1 GB storage</li>
        </ul>
      </article>

      <article class="card card--highlighted">
        <p class="badge">Most Popular</p>
        <h2>Pro</h2>
        <p class="price">$29<span>/mo</span></p>
        <ul>
          <li>Unlimited projects</li>
          <li>Priority support</li>
          <li>50 GB storage</li>
        </ul>
      </article>

      <article class="card">
        <h2>Team</h2>
        <p class="price">$79<span>/mo</span></p>
        <ul>
          <li>Everything in Pro</li>
          <li>5 team seats</li>
          <li>500 GB storage</li>
        </ul>
      </article>
    </div>
  </main>
</body>
</html>
