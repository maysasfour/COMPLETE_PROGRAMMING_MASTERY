<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Design Principles</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card elevation-1">
    <p class="md-label">Elevation 1</p>
    <h3 class="md-headline">Low elevation</h3>
    <p class="md-body">A subtle shadow -- close to the page surface.</p>
    <button class="md-button" id="ripple-button">Click for a ripple</button>
  </div>

  <div class="card elevation-4">
    <p class="md-label">Elevation 4</p>
    <h3 class="md-headline">High elevation</h3>
    <p class="md-body">A much larger, softer shadow -- reads as "closer to the viewer."</p>
  </div>

  <script src="ripple.js"></script>
</body>
</html>
