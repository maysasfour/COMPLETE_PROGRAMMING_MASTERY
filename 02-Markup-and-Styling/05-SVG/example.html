<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SVG Embedding Methods</title>
<style>
  body { font-family: sans-serif; display: flex; gap: 40px; padding: 40px; }
  figure { text-align: center; }

  /* This rule can ONLY affect the INLINE <svg> below -- an <svg> embedded via
     <img> is rendered as an opaque, isolated document; the browser does not
     apply the PAGE's CSS to anything inside it at all, by design (the same
     isolation an <iframe> has). This is the real, verifiable distinction this
     lesson exists to demonstrate. */
  .icon-bg:hover { fill: #dc2626 !important; }
</style>
</head>
<body>

  <figure>
    <figcaption>Inline &lt;svg&gt; (styleable by page CSS)</figcaption>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" id="inline-svg">
      <defs>
        <linearGradient id="bg-gradient-inline" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#4f46e5" />
          <stop offset="100%" stop-color="#7c3aed" />
        </linearGradient>
      </defs>
      <rect class="icon-bg" x="0" y="0" width="100" height="100" rx="12" fill="url(#bg-gradient-inline)" />
      <circle class="icon-highlight" cx="50" cy="38" r="18" fill="#ffffff" opacity="0.9" />
      <path class="icon-arrow" d="M 35 65 L 50 48 L 65 65" stroke="#ffffff" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <text x="50" y="88" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">SVG</text>
    </svg>
    <p>Hover me: turns red</p>
  </figure>

  <figure>
    <figcaption>&lt;img src="icon.svg"&gt; (isolated -- page CSS CANNOT reach inside)</figcaption>
    <img src="icon.svg" width="100" height="100" id="img-svg" class="icon-bg" alt="An icon">
    <p>Hover me: stays the same (proves isolation)</p>
  </figure>

  <figure>
    <figcaption>Same icon, scaled 3x via width/height only</figcaption>
    <img src="icon.svg" width="300" height="300" alt="A larger icon">
    <p>No blur, no quality loss -- vector, not pixels</p>
  </figure>

</body>
</html>
