<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- viewBox="0 0 100 100" defines an internal 100x100 coordinate system,
       independent of the actual rendered width/height; this is what lets
       an SVG scale to any size (see example.html) without redrawing anything. -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>

  <rect class="icon-bg" x="0" y="0" width="100" height="100" rx="12" fill="url(#bg-gradient)" />

  <circle class="icon-highlight" cx="50" cy="38" r="18" fill="#ffffff" opacity="0.9" />

  <!-- A path drawing a simple upward chevron/arrow using explicit commands:
       M (move to), L (line to). -->
  <path class="icon-arrow" d="M 35 65 L 50 48 L 65 65" stroke="#ffffff" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <text x="50" y="88" text-anchor="middle" font-size="12" fill="#ffffff" font-family="sans-serif">
    SVG
  </text>
</svg>
